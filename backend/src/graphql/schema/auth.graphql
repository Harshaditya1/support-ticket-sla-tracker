enum Role {
  REPORTER
  AGENT
}

type AuthPayload {
  token: String!
  user: User!
}

type User {
  id: ID!
  name: String!
  email: String!
  role: Role!
  createdAt: String!
}

input RegisterInput {
  name: String!
  email: String!
  password: String!
  role: Role!
}

input LoginInput {
  email: String!
  password: String!
}

extend type Mutation {
  register(input: RegisterInput!): AuthPayload!
  login(input: LoginInput!): AuthPayload!
}